x-app-env: &app-env
  KAFKA_BROKERS: redpanda:9092
  KAFKA_TOPIC: metrics
  KAFKA_DLQ_TOPIC: metrics-dlq
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/metrics?sslmode=disable
  INGEST_API_KEY: ${INGEST_API_KEY:-dev-api-key-change-me}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-dev-token}
  UI_TOKEN: ${UI_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-app-build: &app-build
  context: .
  args:
    GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

services:
  timescaledb:
    image: timescale/timescaledb:2.22.1-pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: metrics
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrics"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
    shm_size: "256mb"

  redpanda:
    image: redpandadata/redpanda:v25.2.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes:
      - redpanda:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:[[:space:]]+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always

  migrate:
    image: timescale/timescaledb:2.22.1-pg17
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint:
      - psql
      - -h
      - timescaledb
      - -U
      - postgres
      - -d
      - metrics
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /migrations/0001_schema.sql
    restart: "no"

  ingest1: &ingest
    build: *app-build
    image: monitoring-app:local
    command: ["ingest"]
    environment:
      <<: *app-env
      NODE_ID: ingest1
      HTTP_ADDR: ":8081"
      WAL_DIR: /var/lib/wal
      WAL_MAX_BYTES: "536870912"
    volumes:
      - wal1:/var/lib/wal
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  ingest2:
    <<: *ingest
    environment:
      <<: *app-env
      NODE_ID: ingest2
      HTTP_ADDR: ":8081"
      WAL_DIR: /var/lib/wal
      WAL_MAX_BYTES: "536870912"
    volumes:
      - wal2:/var/lib/wal
    ports: []

  ingest3:
    <<: *ingest
    environment:
      <<: *app-env
      NODE_ID: ingest3
      HTTP_ADDR: ":8081"
      WAL_DIR: /var/lib/wal
      WAL_MAX_BYTES: "536870912"
    volumes:
      - wal3:/var/lib/wal
    ports: []

  consumer1: &consumer
    build: *app-build
    image: monitoring-app:local
    command: ["consumer"]
    environment:
      <<: *app-env
      NODE_ID: consumer1
      CONSUMER_GROUP: metrics-consumer
      BATCH_SIZE: "2000"
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  consumer2:
    <<: *consumer
    environment:
      <<: *app-env
      NODE_ID: consumer2
      CONSUMER_GROUP: metrics-consumer
      BATCH_SIZE: "2000"

  consumer3:
    <<: *consumer
    environment:
      <<: *app-env
      NODE_ID: consumer3
      CONSUMER_GROUP: metrics-consumer
      BATCH_SIZE: "2000"

  api:
    build: *app-build
    image: monitoring-app:local
    command: ["api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8082"
      CACHE_TTL: "10s"
      MAX_POINTS_DEFAULT: "2500"
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  nginx:
    build: ./nginx
    image: monitoring-nginx:local
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      ingest1:
        condition: service_healthy
        restart: true
      ingest2:
        condition: service_healthy
        restart: true
      ingest3:
        condition: service_healthy
        restart: true
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  simulator:
    build: *app-build
    image: monitoring-app:local
    command: ["simulator"]
    environment:
      <<: *app-env
      INGEST_URL: http://nginx/v1/ingest
      BACKFILL_URL: http://nginx/internal/backfill
      REFRESH_URL: http://api:8082/internal/refresh-caggs
      SIM_DEVICES: ${SIM_DEVICES:-20}
      SIM_BACKFILL_DAYS: ${SIM_BACKFILL_DAYS:-3}
      SIM_BACKFILL_STEP: ${SIM_BACKFILL_STEP:-1m}
      SIM_RATE: ${SIM_RATE:-1}
      SIM_DEVICE_OFFSET: ${SIM_DEVICE_OFFSET:-1}
    depends_on:
      nginx:
        condition: service_healthy
      api:
        condition: service_healthy
      consumer1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/simulator.ready"]
      interval: 2s
      timeout: 1s
      retries: 120
      start_period: 5s
    restart: always

  seed-year:
    image: monitoring-app:local
    command: ["testbench", "year"]
    environment:
      <<: *app-env
    depends_on:
      nginx:
        condition: service_healthy
      consumer1:
        condition: service_healthy
    restart: "no"

  test-null:
    image: golang:1.25
    profiles: ["test"]
    environment:
      <<: *app-env
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
      INGEST_URL: http://nginx/v1/ingest
      TEST_API_URL: http://nginx
    volumes:
      - .:/src:ro
    depends_on:
      nginx:
        condition: service_healthy
      consumer1:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir /tmp/project
        cp -r /src/go.mod /src/go.sum /src/cmd /src/internal /src/integration /tmp/project/
        cd /tmp/project
        go test -mod=readonly -tags=integration -count=1 -v ./...

volumes:
  pgdata:
  redpanda:
  wal1:
  wal2:
  wal3:

