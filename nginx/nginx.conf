worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;

    upstream ingest_backend {
        least_conn;
        server ingest1:8081 max_fails=3 fail_timeout=5s;
        server ingest2:8081 max_fails=3 fail_timeout=5s;
        server ingest3:8081 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /v1/ingest {
            proxy_pass http://ingest_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_503 non_idempotent;
            proxy_next_upstream_tries 2;
        }

        location /internal/backfill {
            proxy_pass http://ingest_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_503 non_idempotent;
        }

        location / {
            set $query_api api:8082;
            proxy_pass http://$query_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
    }
}
